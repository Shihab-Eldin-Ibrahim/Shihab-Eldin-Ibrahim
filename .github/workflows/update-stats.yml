name: Refresh profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'Shihab-Eldin-Ibrahim/Shihab-Eldin-Ibrahim' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch public GitHub data and render local SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py

      - name: Verify snapshot consistency
        run: python scripts/update_stats.py --from-json assets/stats.json --check

      - name: Commit only refreshed statistics
        shell: bash
        run: |
          git add -- assets/stats-overview.svg assets/stats-languages.svg assets/stats.json
          if git diff --cached --quiet; then
            echo "Statistics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public GitHub statistics"
          git push
