<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">From signals to systems.</title>
  <desc id="desc">A gently animated circuit trace closes the profile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#111C29"/><stop offset="1" stop-color="#090F17"/></linearGradient>
    <style>text{font-family:'Segoe UI',Arial,sans-serif}.trace{stroke-dasharray:35 365;animation:flow 9s linear infinite}@keyframes flow{to{stroke-dashoffset:-400}}@media(prefers-reduced-motion:reduce){.trace{animation:none;stroke-dasharray:none;opacity:.5}}</style>
  </defs>
  <rect x=".5" y=".5" width="999" height="119" rx="14" fill="url(#panel)" stroke="#253543"/>
  <path d="M36 43V77" stroke="#5EEAD4" stroke-width="3"/>
  <text x="53" y="71" fill="#F0F3F6" font-size="31" font-weight="500" letter-spacing="-.6">From signals to systems<tspan fill="#5EEAD4">.</tspan></text>
  <path d="M629 61H689L715 35H767L791 61H832L857 85H909L934 61H967" stroke="#355161" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M629 61H689L715 35H767L791 61H832L857 85H909L934 61H967" class="trace" stroke="#5EEAD4" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="629" cy="61" r="4" fill="#090F17" stroke="#5EEAD4"/>
  <circle cx="967" cy="61" r="4" fill="#A78BFA"/>
</svg>
