    <text x="148" y="230" class="mono" font-size="12" fill="#8DA6B9">MOTOR IMAGERY</text>
    <path d="M319 214H352M346 208L352 214L346 220" stroke="#486273" stroke-width="1.5"/>
    <path class="travel" d="M319 214H352" stroke="#5EEAD4" stroke-width="2"/>
    <rect x="364" y="180" width="274" height="69" rx="10" fill="#0A141F" stroke="#263E4B"/>
    <g fill="#365862"><rect x="385" y="199" width="8" height="8" rx="2" fill="#5EEAD4"/><rect x="398" y="199" width="8" height="8" rx="2"/><rect x="411" y="199" width="8" height="8" rx="2"/><rect x="385" y="212" width="8" height="8" rx="2"/><rect x="398" y="212" width="8" height="8" rx="2" fill="#5EEAD4"/><rect x="411" y="212" width="8" height="8" rx="2"/><rect x="385" y="225" width="8" height="8" rx="2"/><rect x="398" y="225" width="8" height="8" rx="2"/><rect x="411" y="225" width="8" height="8" rx="2" fill="#5EEAD4"/></g>
    <text x="442" y="209" font-size="18" font-weight="600" fill="#E1EAF0">Spatial features</text>
    <text x="442" y="230" class="mono" font-size="12" fill="#8DA6B9">CSP / FBCSP</text>
