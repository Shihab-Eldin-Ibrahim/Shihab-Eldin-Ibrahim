<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">EIDOS-BCI: Motor imagery. Unseen subjects.</title>
  <desc id="desc">Ongoing Brain-Computer Interface research. A pipeline from EEG signals through CSP and FBCSP spatial features to subject-wise evaluation.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="285" gradientUnits="userSpaceOnUse"><stop stop-color="#111C29"/><stop offset="1" stop-color="#0A1019"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEAD4"/><stop offset=".58" stop-color="#5EEAD4" stop-opacity=".1"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".45"/></linearGradient>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Liberation Mono',monospace}
      .travel{stroke-dasharray:12 150;animation:flow 6s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-162}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.travel,.pulse{animation:none}.travel{stroke-dasharray:none;opacity:.5}}
    </style>
  </defs>
  <rect x=".5" y=".5" width="999" height="284" rx="16" fill="url(#panel)" stroke="#2B3C49"/>
  <path d="M20 1H980" stroke="url(#edge)"/>
  <text x="36" y="40" class="mono" font-size="13" letter-spacing="2" fill="#5EEAD4">01 / FEATURED RESEARCH</text>
  <text x="33" y="101" font-size="50" font-weight="650" letter-spacing="-1.6" fill="#F0F3F6">EIDOS-BCI</text>
  <text x="36" y="139" font-size="24" fill="#BCCDD9">Motor imagery. Unseen subjects.</text>
  <circle cx="790" cy="37" r="4" fill="#A78BFA" class="pulse"/>
  <text x="805" y="42" class="mono" font-size="13" letter-spacing=".7" fill="#C0AFF2">ONGOING RESEARCH</text>
