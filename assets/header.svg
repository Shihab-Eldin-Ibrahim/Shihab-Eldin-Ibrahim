    <rect x="760" y="134" width="68" height="68" rx="12" fill="#0C1A24" stroke="#43606C"/>
    <rect x="769" y="143" width="50" height="50" rx="7" stroke="#5EEAD4" stroke-opacity=".3"/>
    <g stroke="#4D7580" stroke-width="2"><path d="M772 126V134M783 126V134M805 126V134M816 126V134M772 202V210M783 202V210M805 202V210M816 202V210M752 146H760M752 157H760M752 179H760M752 190H760M828 146H836M828 157H836M828 179H836M828 190H836"/></g>
    <path d="M619 168H672L682 160L692 176L705 168H725L737 151L750 187L766 129L785 212L804 156L816 173L829 168H851L863 152L875 181L890 163L902 168H948" stroke="#0D151F" stroke-width="8" stroke-linejoin="round"/>
