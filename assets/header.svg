    <path class="trace" d="M619 168H672L682 160L692 176L705 168H725L737 151L750 187L766 129L785 212L804 156L816 173L829 168H851L863 152L875 181L890 163L902 168H948" stroke="#D3FFF4" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#0D151F" stroke="#5EEAD4" stroke-width="1.5"><circle cx="643" cy="81" r="4"/><circle cx="937" cy="122" r="4"/><circle cx="643" cy="257" r="4"/><circle cx="936" cy="210" r="4"/></g>
    <circle cx="794" cy="77" r="4" fill="#5EEAD4" class="beacon"/>
    <circle cx="794" cy="259" r="4" fill="#A78BFA" class="beacon delayed"/>
    <text x="704" y="312" class="mono" font-size="12" letter-spacing="2" fill="#8099AB">HARDWARE × SOFTWARE</text>
