<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Shihab-Eldin Ibrahim Shehu</title>
  <desc id="desc">Electrical Communications and Computer Engineering student at Nahda University, Egypt. An animated signal meets a geometric circuit.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#121E2B"/><stop offset="0.48" stop-color="#0D151F"/><stop offset="1" stop-color="#090F17"/></linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(790 166) rotate(90) scale(180 230)" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEAD4" stop-opacity="0.1"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
    <linearGradient id="signal" x1="619" y1="169" x2="948" y2="169" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEAD4" stop-opacity="0.05"/><stop offset="0.45" stop-color="#5EEAD4"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#B5CAD9" stroke-opacity="0.055"/></pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="998" height="348" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}
      .mono{font-family:Consolas,'Liberation Mono',monospace}
      .trace{stroke-dasharray:70 510;animation:scan 8s linear infinite}
      .beacon{animation:pulse 4s ease-in-out infinite}
      .delayed{animation-delay:2s}
      @keyframes scan{to{stroke-dashoffset:-580}}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.trace,.beacon{animation:none}.trace{stroke-dasharray:none;opacity:.55}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="349" rx="18" fill="url(#panel)" stroke="#253543"/>
  <g clip-path="url(#bounds)">
    <rect x="595" width="405" height="350" fill="url(#grid)"/>
    <rect x="565" width="435" height="350" fill="url(#aura)"/>
    <path d="M52 45H78" stroke="#5EEAD4" stroke-width="3"/>
    <text x="91" y="50" class="mono" font-size="13" letter-spacing="2.1" fill="#A3B6C7">SIGNALS / SYSTEMS / SOFTWARE</text>
    <text x="49" y="119" font-size="53" font-weight="650" letter-spacing="-1.8" fill="#F0F3F6">Shihab-Eldin</text>
    <text x="49" y="178" font-size="53" font-weight="650" letter-spacing="-1.8" fill="#F0F3F6">Ibrahim Shehu<tspan fill="#5EEAD4">.</tspan></text>
    <text x="52" y="224" font-size="20" fill="#C6D3DE">Electrical Communications</text>
    <text x="52" y="253" font-size="20" fill="#C6D3DE">&amp; Computer Engineering student</text>
    <path d="M52 285H555" stroke="#283743"/>
    <circle cx="58" cy="312" r="4" fill="#5EEAD4" class="beacon"/>
    <text x="73" y="317" class="mono" font-size="13" letter-spacing="1" fill="#A3B6C7">NAHDA UNIVERSITY</text>
    <text x="480" y="317" class="mono" font-size="13" letter-spacing="1" fill="#A3B6C7">EGYPT</text>
    <g stroke="#3A6470" stroke-width="1.2">
      <path d="M643 81H704L725 102H861L881 122H937"/>
